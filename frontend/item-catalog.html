<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Webkinz Trading Hub - Items</title> 
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head> 
    <body> 
        <header>
            <div class="pageTitle">
                <h1>Webkinz Trading Hub</h1>
                <h2>A place to organize trades, keep track of your inventory, and create a wishlist.</h2>
            </div>
            <div id="accountButtons">
                <button id="loginButton" class="headerButton">Login</button>
                <button id="registerButton" class="headerButton">Register</button>
            </div>
        </header>
        <main>
            <nav class="card pink">
                <h2>Browse Items</h2>
                <div class="tabs">
                    <button class="tab-links" onclick="openCollection(event, 'type')" id="default-open">Type</button>
                    <button class="tab-links" onclick="openCollection(event, 'theme')">Theme</button>
                    <button class="tab-links" onclick="openCollection(event, 'color')">Color</button>
                    <button class="tab-links" onclick="openCollection(event, 'misc')">Misc</button>
                </div>
                <h3><a>View All</a></h3>
            </nav>
            <div id="type" class="tab-content">
                <h3>By Type</h3>
            </div>
            <div id="theme" class="tab-content">
                <h3>By Theme</h3>
            </div>
            <div id="color" class="tab-content">
                <h3>By Color</h3>
            </div>
            <div id="misc" class="tab-content">
                <h3>By Misc</h3>
            </div>
        </main>
    </body> 
</html>
